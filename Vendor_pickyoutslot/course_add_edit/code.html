<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Partner Add New Course (Light Theme)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#0d59f2",
            "background-light": "#ffffff",
            "text-dark": "#0f172a", 
            "text-label": "#334155",
            "input-bg": "#f8fafc",
          },
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
        },
      },
    }
  </script>
<style>body {
    font-family: "Lexend", sans-serif
    }
.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.form-input, .form-select, .form-textarea {
    background-color: #f8fafc;
    border: 1px solid #0d59f2;
    color: #0f172a;
    border-radius: 0.5rem;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem
    }
.form-input::placeholder, .form-textarea::placeholder {
    color: #64748b
    }
.form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: #0d59f2;
    box-shadow: 0 0 0 1px #0d59f2;
    outline: none;
    background-color: #fff
    }
.form-select {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAVlWjrytzds7y2Vb2XXb3wqlM7qVVuSwpFpYd__T4_Z-MOBgBjwXgNudstQ_9sD3WJRTyZLPrFn8aH8EAtEok3yHMsqEjJSUb-ler0QfzLoHVvTLsa7gL-kUjcTu0u91qjmUuhuUSXmSvcGkIze2y5RyGqCSWftZOKa1lYKYDnElcu9iyym41TFM6FlOFSJ9cSX-ixBAv5M28G_wCr1VoOGYeXu_MdrYjtlAbbRmCO9XqAuw9YmzbjlabpTzfwfP8w0blTHIvHFuQr)
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white text-text-dark">
<div class="relative flex min-h-screen w-full flex-col font-display">
<div class="sticky top-0 z-10 flex flex-col bg-white/90 backdrop-blur-sm border-b border-gray-100">
<div class="flex items-center p-4">
<div class="flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-black" style="font-size: 24px;">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] text-black">Add New Course</h1>
<div class="flex w-12 items-center justify-end">
</div>
</div>
</div>
<main class="flex-1 space-y-6 p-4 pb-28">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="course-name">Course Name</label>
<input class="form-input w-full" id="course-name" name="course-name" placeholder="e.g. Advanced Tennis" type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="description">Description</label>
<textarea class="form-textarea w-full" id="description" name="description" placeholder="Enter a brief course description" rows="4"></textarea>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="max-students">Max Student Count</label>
<input class="form-input w-full" id="max-students" name="max-students" placeholder="e.g. 20" type="number"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="course-duration">Course Duration</label>
<input class="form-input w-full" id="course-duration" name="course-duration" placeholder="e.g. 8 weeks" type="text"/>
</div>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="course-timing">Course Timing</label>
<div class="relative">
<input class="form-input w-full pl-10" id="course-timing" name="course-timing" placeholder="Mon, Wed, Fri | 7 PM - 8 PM" type="text"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">schedule</span>
</div>
</div>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="course-fees">Course Fees</label>
<div class="relative flex items-center">
<input class="form-input w-full rounded-r-none pl-10" id="course-fees" name="course-fees" placeholder="e.g. 5000" type="number"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="text-primary font-bold">₹</span>
</div>
<select class="form-select h-full w-auto rounded-l-none border-l-0" name="fee-type">
<option>Monthly</option>
<option>Half-Annual</option>
<option>Annual</option>
</select>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="gender">Gender</label>
<select class="form-select w-full" id="gender" name="gender">
<option>Any</option>
<option>Male</option>
<option>Female</option>
</select>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="age-range">Age Range</label>
<select class="form-select w-full" id="age-range" name="age-range">
<option>All Ages</option>
<option>5-10 years</option>
<option>11-15 years</option>
<option>16-25 years</option>
<option>25+ years</option>
</select>
</div>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="category">Category</label>
<select class="form-select w-full" id="category" name="category">
<option>Beginner</option>
<option>Intermediate</option>
<option>Expert</option>
</select>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-text-label" for="select-coach">Select Coach</label>
<select class="form-select w-full" id="select-coach" name="select-coach">
<option>Select a coach</option>
<option>John Doe</option>
<option>Jane Smith</option>
<option>Robert Brown</option>
</select>
</div>
</form>
</main>
<div class="fixed bottom-0 left-0 w-full bg-white p-4 border-t border-gray-100">
<button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary text-base font-bold leading-normal text-white shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition-colors">
        Create Course
      </button>
</div>
</div>

</body></html>
