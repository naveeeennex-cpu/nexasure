<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Partner Adjust Group Membership (Light Theme)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#0d59f2",
            "background-light": "#FFFFFF",
            "card-bg": "#F8FAFC","text-main": "#0F172A","text-secondary": "#334155","input-border": "#475569","input-text": "#1E3A8A","accent-blue-light": "#EFF6FF",},
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display text-text-main">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden group/design-root">
<div class="sticky top-0 z-10 flex items-center bg-background-light p-4 justify-between border-b border-gray-200">
<div class="flex size-12 shrink-0 items-center justify-start text-text-main">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-text-main text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Adjust Membership</h2>
<div class="flex size-12 shrink-0"></div>
</div>
<div class="flex flex-1 flex-col justify-between">
<div class="flex flex-col gap-6 p-4">
<div class="flex flex-col gap-1 rounded-lg bg-card-bg border border-gray-200 p-4">
<p class="text-text-secondary text-sm font-normal leading-normal">Group Name</p>
<p class="text-input-text text-base font-bold leading-tight">Morning Yoga Enthusiasts</p>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main" for="membership-type">Membership Type</label>
<div class="relative">
<select class="form-select w-full appearance-none rounded-lg border border-input-border bg-white px-4 py-3 text-input-text focus:border-primary focus:ring-primary" id="membership-type">
<option>Monthly Badminton Pass</option>
<option selected="">Quarterly Yoga Pass</option>
<option>Annual Corporate Pass</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main" for="assigned-time-slot">Assigned Time Slot</label>
<div class="relative flex items-center">
<input class="form-input w-full rounded-lg border border-input-border bg-white py-3 pl-4 pr-12 text-input-text placeholder:text-gray-400 focus:border-primary focus:ring-primary" id="assigned-time-slot" placeholder="Select time slot" type="text" value="7:00 AM - 8:00 AM Daily"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
<span class="material-symbols-outlined">schedule</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main" for="validity-end-date">Validity End Date</label>
<div class="relative flex items-center">
<input class="form-input w-full rounded-lg border border-input-border bg-white py-3 pl-4 pr-12 text-input-text placeholder:text-gray-400 focus:border-primary focus:ring-primary" id="validity-end-date" placeholder="Select date" type="text" value="30 Sep 2024"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main" for="player-limit">Player Limit</label>
<div class="relative">
<input class="form-input w-full rounded-lg border border-input-border bg-white px-4 py-3 text-input-text placeholder:text-gray-400 focus:border-primary focus:ring-primary" id="player-limit" type="number" value="30"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
<span class="material-symbols-outlined">group</span>
</div>
</div>
</div>
</div>
<div class="sticky bottom-0 flex flex-col gap-3 bg-background-light p-4 border-t border-gray-200">
<div class="grid grid-cols-2 gap-3">
<button class="flex w-full items-center justify-center gap-2 rounded-lg bg-accent-blue-light border border-blue-200 px-4 py-3 text-sm font-medium text-primary transition-colors hover:bg-blue-100">
<span class="material-symbols-outlined text-lg">autorenew</span>
            Renew
          </button>
<button class="flex w-full items-center justify-center gap-2 rounded-lg bg-accent-blue-light border border-blue-200 px-4 py-3 text-sm font-medium text-primary transition-colors hover:bg-blue-100">
<span class="material-symbols-outlined text-lg">pause_circle</span>
            Suspend
          </button>
</div>
<button class="w-full rounded-lg bg-primary py-3 text-base font-bold text-white transition-colors hover:bg-blue-700">
          Save Changes
        </button>
</div>
</div>
</div>

</body></html>
