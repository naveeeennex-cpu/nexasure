<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lexend%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-auto min-h-screen w-full flex-col bg-white justify-between group/design-root overflow-x-hidden" style='font-family: Lexend, "Noto Sans", sans-serif;'>
<div>
<div class="flex absolute top-0 left-0 h-full w-full flex-col justify-end items-stretch bg-[#141414]/40">
<div class="flex flex-col items-stretch bg-white rounded-t-xl">
<button class="flex h-5 w-full items-center justify-center pt-2"><div class="h-1 w-9 rounded-full bg-[#e5e7eb]"></div></button>
<div class="flex-1">
<h1 class="text-[#101623] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-3 pt-5">Transaction Details</h1>
<div class="p-4 grid grid-cols-[20%_1fr] gap-x-6">
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Booking ID</p>
<p class="text-[#101623] text-sm font-normal leading-normal">#1234567890</p>
</div>
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Customer Name</p>
<p class="text-[#101623] text-sm font-normal leading-normal">Sarah Johnson</p>
</div>
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Service/Facility Booked</p>
<p class="text-[#101623] text-sm font-normal leading-normal">Yoga Class</p>
</div>
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Date &amp; Time of Booking</p>
<p class="text-[#101623] text-sm font-normal leading-normal">July 20, 2024, 10:00 AM</p>
</div>
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Payout Amount</p>
<p class="text-[#101623] text-sm font-normal leading-normal">$50.00</p>
</div>
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Transaction Status</p>
<p class="text-[#101623] text-sm font-normal leading-normal">Completed</p>
</div>
<div class="col-span-2 grid grid-cols-subgrid border-t border-t-[#f1f5f9] py-5">
<p class="text-[#64748b] text-sm font-normal leading-normal">Payment Method</p>
<p class="text-[#101623] text-sm font-normal leading-normal">Credit Card</p>
</div>
</div>
</div>
</div>
</div>
</div>
<div>
<div class="flex px-4 py-3 bg-white relative z-10">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 flex-1 bg-[#256af4] text-white text-sm font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Close</span>
</button>
</div>
<div class="h-5 bg-white"></div>
</div>
</div>

</body></html>
