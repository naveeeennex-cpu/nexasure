<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Host a Game - Details Input</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#ffffff",
                        "background-dark": "#101622",
                        "surface-light": "#f5f6f8",
                        "surface-dark": "#1a2230",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d121c] dark:text-white antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
<button class="text-[#0d121c] dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-[#0d121c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Game Details</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto no-scrollbar pb-24">
<!-- Venue Hero Section -->
<div class="p-4">
<div class="group relative overflow-hidden rounded-xl bg-gray-100 dark:bg-surface-dark shadow-sm">
<div class="aspect-video w-full bg-cover bg-center" data-alt="Modern soccer stadium field with green turf" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAKxShIbmHdk38o0rTelV5jwhxsbywFj29gIj7apdfV5KfdypKbLm8Sv2DJDTNThtBCkOJ32ZpKen-XlZ8UP5OKkYnP2ZotLt-7CCLauJmLUIYxYIdnu-iQi74w5x3gnGQbclCUdE2gFQuEITAtx15ml9c0LxepyItRIuZrDjggbTkFcE8dio8Ec8Ix6Y_nyiqw9a_VNKqZYWPg-8GkNqkwR0bPQFvOq8lkWWi3NQRnMkgqOoj8SGUnMHojSHN_Pt8PTXg5En0bcq90');">
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
</div>
<div class="absolute bottom-0 left-0 w-full p-4 text-white">
<div class="flex justify-between items-end">
<div>
<h3 class="text-xl font-bold leading-tight">Green Park Stadium</h3>
<p class="text-white/80 text-sm font-medium mt-1">Field 3 - Synthetic Turf</p>
</div>
<div class="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/30">
<p class="text-white font-semibold text-sm">$50/hour</p>
</div>
</div>
</div>
</div>
</div>
<!-- Form Inputs -->
<div class="px-4 space-y-6">
<!-- Game Format -->
<div class="flex flex-col gap-2">
<label class="text-[#0d121c] dark:text-gray-200 text-sm font-semibold leading-normal">Game Format</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 pr-10 text-base font-normal text-[#0d121c] dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all cursor-pointer">
<option value="5v5">5 vs 5</option>
<option value="7v7">7 vs 7</option>
<option value="11v11">11 vs 11</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Date & Time -->
<div class="flex gap-4">
<div class="flex flex-col gap-2 flex-1">
<label class="text-[#0d121c] dark:text-gray-200 text-sm font-semibold leading-normal">Date</label>
<div class="relative">
<input class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 text-base font-normal text-[#0d121c] dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all" type="date" value="2023-10-24"/>
</div>
</div>
<div class="flex flex-col gap-2 flex-1">
<label class="text-[#0d121c] dark:text-gray-200 text-sm font-semibold leading-normal">Time</label>
<div class="relative">
<input class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 text-base font-normal text-[#0d121c] dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all" type="time" value="19:00"/>
</div>
</div>
</div>
<!-- Players & Cost -->
<div class="flex gap-4">
<div class="flex flex-col gap-2 flex-1">
<label class="text-[#0d121c] dark:text-gray-200 text-sm font-semibold leading-normal">Players Needed</label>
<div class="relative flex items-center">
<input class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 pl-12 text-base font-normal text-[#0d121c] dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all" placeholder="10" type="number" value="10"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
<span class="material-symbols-outlined text-[20px]">group</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2 flex-1">
<label class="text-[#0d121c] dark:text-gray-200 text-sm font-semibold leading-normal">Share Amount</label>
<div class="relative flex items-center">
<input class="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 pl-12 text-base font-normal text-[#0d121c] dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all" step="0.50" type="number" value="5.00"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
<span class="material-symbols-outlined text-[20px]">attach_money</span>
</div>
</div>
</div>
</div>
<!-- Calculation Hint -->
<div class="flex items-center gap-2 rounded-lg bg-primary/10 p-3 text-sm text-primary dark:text-primary-light border border-primary/20">
<span class="material-symbols-outlined text-[18px]">info</span>
<span class="font-medium">Total Venue Cost: $50.00</span>
</div>
<!-- Host Toggle -->
<div class="flex items-center justify-between rounded-xl border border-gray-200 dark:border-gray-700 p-4 bg-surface-light dark:bg-surface-dark">
<div class="flex flex-col">
<span class="text-[#0d121c] dark:text-white font-semibold text-base">Will Host be Playing?</span>
<span class="text-gray-500 dark:text-gray-400 text-xs mt-0.5">Include yourself in the player count</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="text-[#0d121c] dark:text-gray-200 text-sm font-semibold leading-normal">Specific Rules / Description</label>
<textarea class="w-full min-h-[120px] rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 text-base font-normal text-[#0d121c] dark:text-white focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-all resize-none" placeholder="e.g. Bring white shirts vs dark shirts. No studs allowed."></textarea>
</div>
</div>
</div>
<!-- Sticky Footer -->
<div class="absolute bottom-0 w-full bg-background-light dark:bg-background-dark border-t border-gray-100 dark:border-gray-800 p-4 pb-8 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<a href="../host_a_game_-_invite_&_confirm/code.html">
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-6 py-4 text-base font-bold leading-normal text-white hover:bg-blue-700 active:bg-blue-800 transition-colors shadow-lg shadow-primary/30">
<span class="material-symbols-outlined">check_circle</span>
                Confirm Game &amp; Invite
            </button>
</a>
</div>
</div>
</body></html>
