<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PickYourSlot - Payment Failed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#0d59f2",
            "dark-blue": "#0f172a","error-red": "#D32F2F",
            "light-gray": "#F3F4F6","subtle-border": "#E2E8F0",},
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 48
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1;
    }
    body {
      min-height: max(667px, 100dvh);}
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white font-display text-dark-blue">
<div class="flex min-h-screen w-full flex-col">
<header class="flex items-center justify-between p-4">
<h1 class="text-lg font-bold text-dark-blue">Payment Status</h1>
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-light-gray transition-colors hover:bg-gray-200">
<span class="material-symbols-outlined !text-2xl !font-normal text-dark-blue">close</span>
</button>
</header>
<main class="flex flex-1 flex-col items-center justify-center p-6 text-center">
<div class="flex flex-col items-center gap-6">
<div class="flex h-32 w-32 items-center justify-center rounded-full bg-light-gray">
<span class="material-symbols-outlined text-7xl text-error-red">close</span>
</div>
<div class="space-y-2">
<h2 class="text-3xl font-bold text-dark-blue">Payment Failed</h2>
<p class="text-slate-600">Your transaction could not be processed.</p>
</div>
</div>
</main>
<footer class="w-full space-y-4 p-6">
<div class="rounded-xl border border-subtle-border bg-white p-4 text-center shadow-sm">
<p class="text-base font-medium text-dark-blue">Reason</p>
<p class="text-lg font-semibold text-error-red">Insufficient Funds</p>
</div>
<div class="flex flex-col gap-3">
<button class="w-full rounded-xl bg-primary py-4 text-base font-semibold text-white shadow-md transition-opacity hover:opacity-90">Try Again</button>
<button class="w-full rounded-xl border-2 border-dark-blue bg-transparent py-3.5 text-base font-semibold text-dark-blue transition-colors hover:bg-gray-50">Contact Support</button>
</div>
</footer>
</div>

</body></html>
