<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PickYourSlot - Edit Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#00c753",
                        "vibrant-blue": "#007AFF",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f2317",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col">
<header class="flex items-center bg-white p-4 pb-2 justify-between sticky top-0 z-10 border-b border-slate-200">
<div class="flex size-12 shrink-0 items-center justify-start">
<a class="text-slate-900" href="#">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</a>
</div>
<h1 class="text-slate-900 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Edit Profile</h1>
<div class="flex size-12 shrink-0 items-center justify-end"></div>
</header>
<main class="flex-grow p-4">
<div class="flex flex-col items-center gap-4 mb-8">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-2 border-vibrant-blue" data-alt="User's profile picture, Alex Morgan" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB7o4pMH7J76fGCkjfCuwsT08W_O_MTVRqDPQ12qRcHl2S98ssp7xxH7KCH5GDWUjCN5F_EHH_GPybNimSLDuO4YK3p_IwhkMwuhzZyopkcF6t3W1WZhHmzQjvXa3egv4G74F8qGKJi3VMp4BqLfByORLKweolWqBXUtfQZswaDEmkx9a_saRtQkMtccdTsCCakjULmKCy7meKNZn5Qz-VsH9pBki1ViviARRW9HTf4NPcIZXVtRzaVzflMA6Y__mhiAKmGjv9_2l8G");'></div>
<button class="absolute bottom-0 right-0 flex h-8 w-8 items-center justify-center rounded-full bg-vibrant-blue text-white">
<span class="material-symbols-outlined text-lg">edit</span>
</button>
</div>
<button class="text-slate-900 text-sm font-medium">Upload/Change Photo</button>
</div>
<form class="space-y-6">
<div>
<label class="text-sm font-medium text-slate-900" for="name">Name</label>
<input class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="name" placeholder="Alex Morgan" type="text"/>
</div>
<div>
<label class="text-sm font-medium text-slate-900" for="email">Email</label>
<input class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="email" placeholder="alex.morgan@email.com" type="email"/>
</div>
<div>
<label class="text-sm font-medium text-slate-900" for="phone">Phone Number</label>
<input class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="phone" placeholder="+1 (555) 123-4567" type="tel"/>
</div>
<div>
<label class="text-sm font-medium text-slate-900" for="dob">Date of Birth</label>
<div class="relative mt-1">
<input class="block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50 pr-10" id="dob" onblur="(this.type='text')" onfocus="(this.type='date')" placeholder="Select a date" type="text"/>
<span class="material-symbols-outlined pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-vibrant-blue">calendar_today</span>
</div>
</div>
<div class="space-y-4">
<div>
<label class="text-sm font-medium text-slate-900" for="address1">Address 1</label>
<input class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="address1" placeholder="e.g., Home Address" type="text"/>
</div>
<div>
<label class="text-sm font-medium text-slate-900" for="address2">Address 2</label>
<input class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="address2" placeholder="e.g., Work Address" type="text"/>
</div>
<div>
<label class="text-sm font-medium text-slate-900" for="address3">Address 3</label>
<input class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="address3" placeholder="e.g., Other" type="text"/>
</div>
</div>
<div>
<label class="text-sm font-medium text-slate-900" for="description">Description/Bio</label>
<textarea class="mt-1 block w-full rounded-lg border-slate-300 bg-white text-slate-900 placeholder-slate-500 focus:border-vibrant-blue focus:ring focus:ring-vibrant-blue focus:ring-opacity-50" id="description" placeholder="Tell us a little about yourself..." rows="4"></textarea>
</div>
</form>
</main>
<div class="p-4 mt-auto sticky bottom-0 bg-white">
<button class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-vibrant-blue text-white text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Save Changes</span>
</button>
</div>
</div>

</body></html>
