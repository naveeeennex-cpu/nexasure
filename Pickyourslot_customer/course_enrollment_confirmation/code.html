<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Course Enrollment Confirmation</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0d59f2",
              "background-light": "#f5f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            keyframes: {
                'pop-in': {
                    '0%': { transform: 'scale(0.8)', opacity: '0' },
                    '100%': { transform: 'scale(1)', opacity: '1' },
                }
            },
            animation: {
                'pop-in': 'pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d121c] dark:text-white antialiased overflow-x-hidden selection:bg-primary/20">
<div class="relative flex min-h-screen w-full flex-col group/design-root max-w-md mx-auto bg-white dark:bg-background-dark shadow-xl overflow-hidden">
<!-- Header: Close Button -->
<div class="flex items-center justify-end p-4 pb-2">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#0d121c] dark:text-white" style="font-size: 24px;">close</span>
</button>
</div>
<!-- Success Hero Section -->
<div class="flex flex-col items-center justify-center px-6 pt-4 pb-6 text-center animate-pop-in">
<!-- Animated Icon Background -->
<div class="relative mb-6">
<!-- Decorative background elements representing confetti -->
<div class="absolute top-0 right-0 -mt-2 -mr-2 h-3 w-3 rounded-full bg-primary/40"></div>
<div class="absolute bottom-0 left-0 -mb-1 -ml-3 h-2 w-2 rounded-full bg-primary/60"></div>
<div class="absolute top-1/2 left-0 -ml-8 h-4 w-4 rounded-full bg-primary/20"></div>
<div class="flex size-24 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 shadow-inner">
<span class="material-symbols-outlined text-primary text-[64px]" style="font-variation-settings: 'FILL' 1, 'wght' 600;">check_circle</span>
</div>
</div>
<h1 class="text-3xl font-bold leading-tight text-[#0d121c] dark:text-white mb-3">Enrollment Successful!</h1>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-relaxed max-w-[280px]">
                You are all set for <span class="text-gray-800 dark:text-gray-200 font-medium">Advanced UX Design</span>. A confirmation email has been sent.
            </p>
</div>
<!-- Booking Reference Card -->
<div class="px-6 py-2 w-full">
<div class="flex flex-col items-center justify-center gap-1 rounded-xl border border-[#ced7e8] dark:border-gray-700 bg-background-light/50 dark:bg-gray-800/50 p-4 shadow-sm backdrop-blur-sm">
<p class="text-[#49659c] dark:text-blue-300 text-xs font-medium uppercase tracking-wider">Booking Reference</p>
<div class="flex items-center gap-2">
<p class="text-[#0d121c] dark:text-white text-xl font-bold tracking-tight">#REF-2024-X</p>
<button class="text-primary hover:text-blue-700 dark:hover:text-blue-300 transition-colors flex items-center justify-center p-1" title="Copy Reference">
<span class="material-symbols-outlined" style="font-size: 18px;">content_copy</span>
</button>
</div>
</div>
</div>
<!-- Course Summary Snippet -->
<div class="px-6 py-4 w-full">
<h2 class="text-[#0d121c] dark:text-white text-sm font-semibold mb-3 px-1">Enrolled Course</h2>
<div class="flex w-full items-center gap-4 bg-white dark:bg-gray-800 rounded-xl p-3 border border-[#ced7e8] dark:border-gray-700 shadow-sm">
<!-- Course Image -->
<div class="relative h-20 w-20 shrink-0 overflow-hidden rounded-lg bg-gray-200">
<div class="absolute inset-0 bg-center bg-no-repeat bg-cover" data-alt="Abstract colorful geometric pattern representing UX design" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAZxoZlTjRp7zcpf6t8__AFGTwQSnUFk2MpYQeq8N7GoJeVeK7JerGeIAIZBWY6gkt4pqq11_htX9RDhwXrvd0whP6qjIYqFsu55ZjqJ1aLpaA9palTFtMUIfVNOtHGOV7AwjOBlN4_qj4uvUGwxjQZB71wlRD8xinYPExnOzbCTfM9gZJoQTcorlPE4Y5-IbtCfbkbXbt8dnAXf89I0YK_wBvLS6_GZvgyjNu-0n4F85Lq05IuNGfzDpv4jyArYg9ZZ5Ow24kLoQg1");'>
</div>
</div>
<!-- Details -->
<div class="flex flex-col justify-center flex-1 min-w-0">
<h3 class="text-[#0d121c] dark:text-white text-base font-bold truncate leading-tight mb-1">Advanced UX Design</h3>
<div class="flex items-center gap-1.5 text-gray-500 dark:text-gray-400 text-sm mb-0.5">
<span class="material-symbols-outlined text-primary" style="font-size: 16px;">calendar_month</span>
<span>Mon, Oct 12</span>
</div>
<div class="flex items-center gap-1.5 text-gray-500 dark:text-gray-400 text-sm">
<span class="material-symbols-outlined text-primary" style="font-size: 16px;">schedule</span>
<span>10:00 AM - 12:00 PM</span>
</div>
</div>
</div>
</div>
<!-- Spacer to push content up and buttons down -->
<div class="flex-grow"></div>
<!-- Action Buttons -->
<div class="w-full p-6 flex flex-col gap-3 mt-4">
<button class="flex w-full items-center justify-center rounded-xl bg-primary px-4 py-4 text-white shadow-lg shadow-primary/25 transition-transform active:scale-[0.98] hover:bg-blue-700">
<span class="text-base font-bold tracking-wide">View My Courses</span>
</button>
<button class="flex w-full items-center justify-center rounded-xl bg-transparent px-4 py-3 text-primary transition-colors hover:bg-primary/5 active:bg-primary/10">
<span class="text-base font-semibold">Go to Home</span>
</button>
</div>
<div class="h-2 w-full"></div>
</div>
</body></html>
