<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Request Sent</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d121c] dark:text-white font-display antialiased">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top Navigation (Minimalist) -->
<div class="flex items-center justify-end p-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">close</span>
</button>
</div>
<!-- Main Content (Centered) -->
<div class="flex-1 flex flex-col items-center justify-center px-6 pb-10 w-full">
<!-- Hero Icon with Animation Effect -->
<div class="relative mb-8 group">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl scale-75 animate-pulse"></div>
<div class="relative h-28 w-28 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[64px] font-bold" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<!-- Headlines -->
<h1 class="text-[#0d121c] dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center mb-3">
                Request Sent!
            </h1>
<h2 class="text-slate-600 dark:text-slate-300 text-lg font-medium leading-snug tracking-normal text-center px-2 mb-6">
                Your Bulk Booking Request Has Been Sent!
            </h2>
<!-- Contextual Body Text -->
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed text-center max-w-[320px] mb-8">
                A venue partner will review your request details and contact you shortly with a personalized quote.
            </p>
<!-- Request Reference Card -->
<div class="w-full bg-white dark:bg-[#1A2230] rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col items-center justify-center mb-8">
<span class="text-slate-400 dark:text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">Request Reference ID</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">tag</span>
<span class="text-[#0d121c] dark:text-white font-bold text-lg tracking-wide">BB-2023-8492</span>
</div>
<div class="text-xs text-slate-400 mt-2">Submitted on Oct 24, 2023</div>
</div>
</div>
<!-- Sticky Bottom Actions -->
<div class="p-6 bg-background-light dark:bg-background-dark w-full mt-auto">
<button class="w-full bg-primary hover:bg-blue-600 active:bg-blue-700 text-white font-bold text-base h-14 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mb-3">
<span>View My Requests</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-primary dark:text-blue-400 font-semibold text-base h-14 rounded-xl transition-colors">
                Go to Home
            </button>
</div>
</div>
</body></html>
